version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stellar_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-stellar_insured}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-stellar_insured}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: stellar_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: stellar_app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_DATABASE:-stellar_insured}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      EMAIL_QUEUE_MAX_ATTEMPTS: ${EMAIL_QUEUE_MAX_ATTEMPTS:-5}
      PUSH_QUEUE_MAX_ATTEMPTS: ${PUSH_QUEUE_MAX_ATTEMPTS:-5}
      IPFS_PIN_QUEUE_MAX_ATTEMPTS: ${IPFS_PIN_QUEUE_MAX_ATTEMPTS:-5}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-10485760}
      S3_PRESIGN_EXPIRY: ${S3_PRESIGN_EXPIRY:-3600}
      IPFS_INIT_TIMEOUT_MS: ${IPFS_INIT_TIMEOUT_MS:-5000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data: